[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ariadne"
version = "0.1.0"
description = "Authorized-scope security testing web crawler (Scrapy + curl_cffi + Playwright)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ariadne Contributors" }]
dependencies = [
  "scrapy>=2.11",
  "curl_cffi>=0.7",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "itemadapter>=0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]
browser = [
  "playwright>=1.40",
]

[project.scripts]
ariadne = "ariadne.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ariadne"]

[tool.hatch.build.targets.wheel.force-include]
"ariadne/stealth/profiles.yaml" = "ariadne/stealth/profiles.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"