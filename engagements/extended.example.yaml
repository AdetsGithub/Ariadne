# Extended engagement template (reference)
#
# Copy to engagement.yaml and edit. Validate with:
#   ariadne validate engagement.yaml
#
# Full field docs: docs/CONFIGURATION.md
# Runbook: docs/OPERATOR.md

engagement:
  id: "ACME-2026-Q3-WEB"
  client: "ACME Corp"
  operator: "redteam@example.com"
  authorized_until: "2026-12-31T23:59:59Z"

scope:
  allow_domains:
    - "app.acme.example"
    - "acme.example"
  allow_url_regex:
    - "^https://(app\\.)?acme\\.example/.*"
  deny_url_regex:
    - ".*/logout.*"
    - ".*/signout.*"
    - ".*/admin/delete.*"
  max_depth: 4
  # observe = inventory Disallow + defer fetches (default)
  # obey    = skip Disallow
  # ignore  = do not fetch robots.txt
  respect_robots: observe

crawl:
  mode: map
  start_urls:
    - "https://app.acme.example/"
  transport:
    initial_mode: L1_impersonate
    escalate_to:
      - L2_browser
      # - L3_unlocker   # enable only with ARIADNE_UNLOCKER_URL + budget
# When L2 is on, profiles are filtered to Playwright Chromium major.
# Omit impersonate_profiles (or leave unset) to use the full catalog.
  concurrency:
    max_concurrent_requests: 8
    download_delay_mean: 2.0
    download_delay_std: 0.8
  session:
    challenge_lease_ttl_seconds: 120
    clearance_wait_delay_mean: 2.0
    escalation_priority: 100
  browser:
    headless: false
    pool_size: 4
    checkout_timeout_seconds: 60
    execution_timeout_seconds: 180
    max_contexts_served: 5000
    disable_webrtc: true
    proxy_dns: true
    humanize: true
    capture_network: false
  honeypot:
    l1_unverified: defer
  proxies:
    class: residential
    sticky_ttl_seconds: 600
    # Sticky residential URLs, e.g.:
    # "http://user-session-SESSIONID:pass@proxy.example:8000"
    urls: []

output:
  dir: "./artifacts"
  formats: [ndjson, markdown_summary]
  capture:
    screenshots: on_challenge_or_error
    har: on_apisnoop_or_challenge
  redact_pii: true
