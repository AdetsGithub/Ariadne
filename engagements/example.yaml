engagement:
  id: "EXAMPLE-001"
  client: "Example Corp"
  operator: "redteam@example.com"
  authorized_until: "2099-12-31T23:59:59Z"

scope:
  allow_domains:
    - "example.com"
  allow_url_regex:
    - "^https://example\\.com/.*"
  deny_url_regex:
    - ".*/logout.*"
  max_depth: 2
  respect_robots: observe

crawl:
  mode: map
  start_urls:
    - "https://example.com/"
  transport:
    initial_mode: L1_impersonate
    escalate_to: [L2_browser]
    impersonate_profiles: [chrome124, chrome131]
  concurrency:
    max_concurrent_requests: 4
    download_delay_mean: 1.0
    download_delay_std: 0.5
  session:
    challenge_lease_ttl_seconds: 120
    clearance_wait_delay_mean: 2.0
    escalation_priority: 100
  browser:
    pool_size: 4
    max_contexts_served: 5000
    disable_webrtc: true
    proxy_dns: true
  honeypot:
    l1_unverified: defer
  proxies:
    class: residential
    sticky_ttl_seconds: 600
    urls: []

output:
  dir: "./artifacts"
  formats: [ndjson, markdown_summary]
  capture:
    screenshots: on_challenge_or_error
    har: on_apisnoop_or_challenge
  redact_pii: true
